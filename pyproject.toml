[build-system]
requires = ["setuptools>=77"]
build-backend = "setuptools.build_meta"

[project]
name = "protect-dl"
dynamic = ["version"]
description = "Download footage for a time range from a local UniFi Protect console, resumably, with merge and timelapse"
readme = "README.md"
license = "Apache-2.0"
license-files = ["LICENSE"]
authors = [{ name = "Alex N. Jose" }]
requires-python = ">=3.11"
keywords = ["unifi", "protect", "ubiquiti", "nvr", "cctv", "video", "download", "timelapse"]
classifiers = [
    "Development Status :: 4 - Beta",
    "Environment :: Console",
    "Intended Audience :: End Users/Desktop",
    "Operating System :: MacOS",
    "Operating System :: POSIX :: Linux",
    "Programming Language :: Python :: 3",
    "Topic :: Multimedia :: Video",
]
dependencies = [
    "httpx>=0.27",
    "rich>=13",
    "python-dotenv>=1",
]

[project.optional-dependencies]
dev = ["pytest>=8", "ruff>=0.6"]

[project.urls]
Homepage = "https://github.com/alexnj/protect-dl"
Issues = "https://github.com/alexnj/protect-dl/issues"
Changelog = "https://github.com/alexnj/protect-dl/blob/main/CHANGELOG.md"

[project.scripts]
protect-dl = "protect_dl.cli:main"

[tool.setuptools.dynamic]
version = { attr = "protect_dl.__version__" }

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["src"]

[tool.ruff]
line-length = 110
target-version = "py311"

[tool.ruff.lint]
select = ["E", "F", "I", "B", "UP"]
ignore = ["E501"]
